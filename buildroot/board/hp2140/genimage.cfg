image state.ext4 {
  ext4 {
    label = "REMOTEOS_STATE"
    use-mke2fs = true
    extraargs = "-U 524f5331-0000-4000-8000-000000000002 -E hash_seed=524f5331-0000-4000-8000-000000000003,lazy_itable_init=0,lazy_journal_init=0"
  }
  size = 512M
  empty = true
}
image remoteos-hp2140.img {
  hdimage {
    partition-table-type = "mbr"
    disk-signature = 0x524f5331
  }
  partition boot {
    in-partition-table = "no"
    image = "boot.img"
    offset = 0
    size = 512
    holes = {"(440; 512)"}
  }
  partition grub {
    in-partition-table = "no"
    image = "grub.img"
    offset = 512
  }
  partition root {
    partition-type = 0x83
    bootable = true
    image = "rootfs.squashfs"
    offset = 1M
    size = 1536M
  }
  partition state {
    partition-type = 0x83
    image = "state.ext4"
  }
}
