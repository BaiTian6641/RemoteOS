# Multitouch touchpads need a driver that converts contacts to pointer motion.
# Keep keyboards and ordinary mice on the existing evdev catch-all rules.
Section "InputClass"
    Identifier "RemoteOS touchpad"
    MatchIsTouchpad "on"
    MatchDevicePath "/dev/input/event*"
    Driver "libinput"
    Option "Tapping" "on"
EndSection
