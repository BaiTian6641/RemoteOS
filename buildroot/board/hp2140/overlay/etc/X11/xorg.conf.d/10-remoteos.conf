Section "ServerFlags"
    Option "DontVTSwitch" "true"
    Option "DontZap" "true"
EndSection
Section "Device"
    Identifier "Intel GMA 950"
    Driver "intel"
    Option "AccelMethod" "sna"
    Option "XvPreferOverlay" "false"
    # SNA also uses SwapbuffersWait to initialize XV_SYNC_TO_VBLANK.
    # A full-screen scanline wait can stall this GMA 950's textured video.
    # Present the newest remote frame immediately; occasional tearing is
    # preferable to accumulating hundreds of milliseconds of input delay.
    Option "SwapbuffersWait" "false"
    # RemoteOS's Intel package patch keeps SNA/XVideo acceleration and draws
    # only the pointer through Xorg's software sprite on this older GPU.
    Option "SWCursor" "true"
EndSection
