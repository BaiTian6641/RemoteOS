set default=0
set timeout=3
menuentry "RemoteOS HP 2140 diagnostic" {
  linux /boot/bzImage root=PARTUUID=524f5331-01 rootfstype=squashfs ro rootwait console=tty1 quiet
}
menuentry "RemoteOS verbose diagnostic" {
  linux /boot/bzImage root=PARTUUID=524f5331-01 rootfstype=squashfs ro rootwait console=tty1 loglevel=7 remoteos.diagnostic=1
}
menuentry "RemoteOS serial diagnostic (115200 baud)" {
  linux /boot/bzImage root=PARTUUID=524f5331-01 rootfstype=squashfs ro rootwait console=tty1 console=ttyS0,115200 loglevel=7 remoteos.diagnostic=1
}
